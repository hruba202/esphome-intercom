<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Park once. Retrieve from another phone.</title><desc id="desc">700 requests parking. 701 is an example of the assigned slot. Do not transfer to 700 after pressing Park. Directed pickup answers a ringing phone and is a different operation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52738f"/></marker></defs><rect width="1100" height="530" rx="18" fill="#f3f7fc"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="28" font-weight="700" fill="#162b45">Park once. Retrieve from another phone.</text><text x="36" y="80" font-size="17" fill="#486179">700 requests parking. 701 is an example of the assigned slot.</text><path d="M315,245 L400,245" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660,245 L745,245" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="175" width="280" height="140" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="53" y="205" font-size="20" font-weight="700" fill="#153e64">1. Kitchen is on a call</text><text x="53" y="233" font-size="16" fill="#334f6b">Press Park in the HA card</text><text x="53" y="257" font-size="16" fill="#334f6b">OR transfer to 700 on a handset</text><rect x="400" y="175" width="260" height="140" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="418" y="205" font-size="20" font-weight="700" fill="#153e64">2. HA retains the caller</text><text x="418" y="233" font-size="16" fill="#334f6b">Example assigned slot: 701</text><text x="418" y="257" font-size="16" fill="#334f6b">Kitchen is free for other calls</text><rect x="745" y="175" width="315" height="140" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="763" y="205" font-size="20" font-weight="700" fill="#153e64">3. Office dials 701</text><text x="763" y="233" font-size="16" fill="#334f6b">Office takes the parked call</text><text x="763" y="257" font-size="16" fill="#334f6b">The caller does not redial</text><text x="36" y="493" font-size="16" fill="#486179">Do not transfer to 700 after pressing Park. Directed pickup answers a ringing phone and is a different operation.</text></g></svg>