<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">What happens when nobody answers?</title><desc id="desc">Optional phone settings live in HA and still apply when the card is closed. Accepted call-control automation actions override the default. A notification alone does not take over.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52738f"/></marker></defs><rect width="1100" height="530" rx="18" fill="#f3f7fc"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="28" font-weight="700" fill="#162b45">What happens when nobody answers?</text><text x="36" y="80" font-size="17" fill="#486179">Optional phone settings live in HA and still apply when the card is closed.</text><path d="M240,236 L305,236" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M635,215 L740,142" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M635,238 L740,262" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M635,260 L740,382" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="185" width="205" height="104" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="53" y="215" font-size="20" font-weight="700" fill="#153e64">Incoming call</text><text x="53" y="243" font-size="16" fill="#334f6b">Kitchen starts ringing</text><rect x="305" y="165" width="330" height="145" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="323" y="195" font-size="20" font-weight="700" fill="#153e64">Optional ringing limit</text><text x="323" y="223" font-size="16" fill="#334f6b">No limit: no extra PBX deadline</text><text x="323" y="247" font-size="16" fill="#334f6b">With a limit: choose an outcome</text><text x="323" y="271" font-size="16" fill="#334f6b">An accepted answer cancels it</text><rect x="740" y="105" width="300" height="75" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="758" y="135" font-size="20" font-weight="700" fill="#153e64">Hang up</text><text x="758" y="163" font-size="16" fill="#334f6b">End this attempt</text><rect x="740" y="225" width="300" height="75" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="758" y="255" font-size="20" font-weight="700" fill="#153e64">Forward</text><text x="758" y="283" font-size="16" fill="#334f6b">Try another destination</text><rect x="740" y="345" width="300" height="75" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="758" y="375" font-size="20" font-weight="700" fill="#153e64">Voicemail</text><text x="758" y="403" font-size="16" fill="#334f6b">Record in an enabled mailbox</text><text x="36" y="493" font-size="16" fill="#486179">Accepted call-control automation actions override the default. A notification alone does not take over.</text></g></svg>