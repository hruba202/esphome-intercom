<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Choose a phone, then a destination</title><desc id="desc">The card and HA automations control a phone. Home Assistant handles its call. ESP hardware is optional. This shows HA-managed routing, not a claim that all RTP passes through HA.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52738f"/></marker></defs><rect width="1100" height="530" rx="18" fill="#f3f7fc"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="28" font-weight="700" fill="#162b45">Choose a phone, then a destination</text><text x="36" y="80" font-size="17" fill="#486179">The card and HA automations control a phone. Home Assistant handles its call.</text><path d="M265,235 L340,235" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M585,215 L675,156" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M585,255 L675,286" fill="none" stroke="#52738f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="175" width="230" height="120" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="53" y="205" font-size="20" font-weight="700" fill="#153e64">Controls</text><text x="53" y="233" font-size="16" fill="#334f6b">Phone card</text><text x="53" y="257" font-size="16" fill="#334f6b">HA automation</text><rect x="340" y="175" width="245" height="120" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="358" y="205" font-size="20" font-weight="700" fill="#153e64">Calling phone</text><text x="358" y="233" font-size="16" fill="#334f6b">For example: Reception</text><text x="358" y="257" font-size="16" fill="#334f6b">Chosen by name in HA</text><rect x="675" y="115" width="380" height="82" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="693" y="145" font-size="20" font-weight="700" fill="#153e64">Internal destination</text><text x="693" y="173" font-size="16" fill="#334f6b">HA phone, SIP handset or ESP</text><rect x="675" y="245" width="380" height="82" rx="12" fill="white" stroke="#a9c5df" stroke-width="2"/><text x="693" y="275" font-size="20" font-weight="700" fill="#153e64">External destination</text><text x="693" y="303" font-size="16" fill="#334f6b">Selected SIP trunk -&gt; provider/PBX</text><text x="36" y="493" font-size="16" fill="#486179">ESP hardware is optional. This shows HA-managed routing, not a claim that all RTP passes through HA.</text></g></svg>