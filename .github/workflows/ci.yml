name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out coordinated ESP component sources
        working-directory: ..
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !endsWith(github.ref_name, '-dev'))) && 'main' || 'dev' }}
        run: |
          git clone --depth 1 --branch "$COMPONENT_REF" https://github.com/n-IA-hane/esphome-voip-stack.git
          git clone --depth 1 --branch "$COMPONENT_REF" https://github.com/n-IA-hane/esphome-audio-stack.git
          git clone --depth 1 --branch "$COMPONENT_REF" https://github.com/n-IA-hane/esphome-runtime-controller.git
          git clone --depth 1 --branch main https://github.com/Psix-anp/esphome-esp-video-camera.git
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-firmware-test.txt
      - name: Check Python code and test fixtures
        run: python -m ruff check custom_components/voip_stack scripts tests
      - name: Run software suite
        run: PYTHON=python scripts/test_suite.sh software-full --keep-going

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install audio decoder for real media tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake libssl-dev libsndfile1-dev zlib1g-dev
      - name: Build pinned independent SIP test peer
        run: |
          scripts/build_sip_test_peer.sh "$RUNNER_TEMP/sip-peer"
          echo "$RUNNER_TEMP/sip-peer/bin" >> "$GITHUB_PATH"
          echo "VOIP_TEST_BARESIP_MODULE_PATH=$RUNNER_TEMP/sip-peer/lib/baresip/modules" >> "$GITHUB_ENV"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-ha-test.txt
      - name: Run Home Assistant suite
        run: PYTHON=python HA_PYTHON=python scripts/test_suite.sh ha --keep-going

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install mkdocs==1.6.1
      - run: mkdocs build --strict
