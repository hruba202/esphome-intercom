name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      component_manifest:
        description: Exact coordinated-sources.json from a previous run (blank follows dev/main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out coordinated ESP component sources
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !endsWith(github.ref_name, '-dev'))) && 'main' || 'dev' }}
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
        run: >-
          python3 scripts/coordinated_sources.py --root .. --ref "$COMPONENT_REF"
          --output test-results/coordinated-sources.json
      - name: Preserve coordinated source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinated-sources
          path: test-results/coordinated-sources.json
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-firmware-test.txt
      - name: Verify Node frontend test dependency
        run: node --version
      - name: Check Python code and test fixtures
        run: python -m ruff check custom_components/voip_stack scripts tests
      - name: Run software suite
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/software.xml -ra
        run: PYTHON=python scripts/test_suite.sh software-full --keep-going
      - name: Require executed software tests
        run: python scripts/check_test_results.py test-results/software.xml
      - name: Preserve software test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-results
          path: test-results/software.xml
          if-no-files-found: error

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies for independent SIP and video peers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake libssl-dev libsndfile1-dev zlib1g-dev \
            sip-tester libavcodec-dev libavfilter-dev libavformat-dev \
            libswscale-dev libavdevice-dev libavutil-dev
      - name: Build pinned independent SIP test peer
        run: |
          scripts/build_sip_test_peer.sh "$RUNNER_TEMP/sip-peer"
          echo "$RUNNER_TEMP/sip-peer/bin" >> "$GITHUB_PATH"
          echo "VOIP_TEST_BARESIP_MODULE_PATH=$RUNNER_TEMP/sip-peer/lib/baresip/modules" >> "$GITHUB_ENV"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-ha-test.txt
      - name: Run Home Assistant suite
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/home-assistant.xml -ra
        run: PYTHON=python HA_PYTHON=python scripts/test_suite.sh ha --keep-going
      - name: Require executed Home Assistant tests
        run: python scripts/check_test_results.py test-results/home-assistant.xml
      - name: Preserve Home Assistant test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-assistant-results
          path: test-results/home-assistant.xml
          if-no-files-found: error

  browser-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-browser-test.txt
      - name: Install browser and media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser-bin"
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runner:
              Path(os.environ["RUNNER_TEMP"], "browser-bin", "chromium").symlink_to(
                  runner.chromium.executable_path
              )
          PY
          echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
      - name: Check call controls and decoded video in Chromium
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/browser.xml -ra
        run: PYTHON=python scripts/test_suite.sh browser --keep-going
      - name: Require executed browser tests
        run: python scripts/check_test_results.py test-results/browser.xml
      - name: Preserve browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: test-results/browser.xml
          if-no-files-found: error

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install mkdocs==1.6.1
      - run: mkdocs build --strict
