is_call_state:
  fields:
    state:
      required: true
      selector:
        select:
          options:
          - calling
          - ringing
          - remote_ringing
          - in_call
          - idle
is_call_origin:
  fields:
    ingress:
      required: true
      selector:
        select:
          options:
          - extension
          - trunk
          translation_key: call_ingress
is_phone_available:
  fields:
    phone:
      required: true
      selector:
        text: {}
is_dtmf_result:
  fields:
    status:
      required: true
      default: received
      selector:
        select:
          options:
          - received
          - timeout
          translation_key: dtmf_result
    digits:
      selector:
        text: {}

is_phone_state:
  fields:
    phone:
      required: true
      selector:
        device:
          filter:
          - integration: voip_stack
            model: Home Assistant softphone
          - integration: voip_stack
            model: SIP account
          - integration: esphome
    state:
      required: true
      selector:
        select:
          options:
          - idle
          - unavailable
          - calling
          - ringing
          - in_call
          - held
          translation_key: phone_state
has_ringing_call:
  fields:
    phone:
      required: true
      selector:
        device:
          filter:
          - integration: voip_stack
            model: Home Assistant softphone
          - integration: voip_stack
            model: SIP account
          - integration: esphome
has_voicemail:
  fields:
    phone:
      required: true
      selector:
        device:
          filter:
          - integration: voip_stack
            model: Home Assistant softphone
          - integration: voip_stack
            model: SIP account
          - integration: esphome
    unread_only:
      default: true
      selector:
        boolean: {}
