# Spotpear full-experience VoIP navigation.
#
# Round page navigation is owned by round_navigate: Assist, contacts, dialer,
# Options. Up advances, down returns, and neither endpoint wraps.
#
# Requires the full-experience scripts/globals:
#   round_navigate, nav_anim, nav_anim_ms.

script:
  - id: !extend settings_open_transition
    then:
      - lambda: |-
          id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_TOP;
          id(nav_anim_ms) = 300;

  - id: !extend settings_close_transition
    then:
      - lambda: |-
          id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_BOTTOM;
          id(nav_anim_ms) = 300;

  - id: call_to_settings
    then:
      - script.execute:
          id: round_navigate
          delta: 1

  - id: call_to_va
    then:
      - script.execute:
          id: round_navigate
          delta: -1
