# Spotpear full-experience VoIP navigation.
#
# Legacy call-page bridges retain their existing settings and VA owners.
# Modern round pages invoke round_navigate directly; these compatibility
# actions also serve the first-generation layout, which has no dialer.
#
# Requires the full-experience scripts/globals:
#   settings_open, swipe_to_va, nav_anim, nav_anim_ms.

script:
  - id: !extend settings_open_transition
    then:
      - lambda: |-
          id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_TOP;
          id(nav_anim_ms) = 300;

  - id: !extend settings_close_transition
    then:
      - lambda: |-
          id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_BOTTOM;
          id(nav_anim_ms) = 300;

  - id: call_to_settings
    then:
      - script.execute: settings_open

  - id: call_to_va
    then:
      - script.execute: swipe_to_va
