# Voice Assistant application content and local command handling.
#
# Runtime Controller observes lifecycle triggers automatically. These actions
# retain application behavior beyond state forwarding.

voice_assistant:
  id: va
  media_player: speaker_media_player
  # Allow the HTTP reader's connection attempts before reporting a start failure.
  tts_playback_start_timeout: 35s
  on_stt_end:
    - script.execute:
        id: ui_stt_ended
        text: !lambda 'return x;'
    # Commands that silence the current satellite must not be delegated to the
    # selected conversation agent. Agents differ in local-intent handling and
    # may otherwise answer the phrase instead of stopping their announcement.
    - if:
        condition:
          lambda: |-
            std::string command = x;
            std::transform(command.begin(), command.end(), command.begin(),
                           [](unsigned char c) { return std::tolower(c); });
            while (!command.empty() && std::isspace(static_cast<unsigned char>(command.front())))
              command.erase(command.begin());
            while (!command.empty() && (std::isspace(static_cast<unsigned char>(command.back())) ||
                   command.back() == '.' || command.back() == '!' || command.back() == '?'))
              command.pop_back();
            return command == "stai zitta" || command == "sta zitta" ||
                   command == "zitta" || command == "zitto" || command == "taci" ||
                   command == "basta" || command == "annulla" ||
                   command == "ferma la risposta" || command == "smetti di parlare";
        then:
          - script.execute: voice_quiet_internal
  on_tts_start:
    - logger.log:
        level: INFO
        tag: va
        format: "VA: tts_start"
    # ESPHome's on_tts_start payload is the assistant response text. Populate
    # text/mood before committing the responding state so renderers never see
    # an empty or transport-URL response frame.
    - script.execute:
        id: ui_tts_started
        text: !lambda 'return x;'
  on_client_connected:
    - logger.log:
        tag: va
        format: "VA: client connected"
    - globals.set:
        id: init_in_progress
        value: "false"
