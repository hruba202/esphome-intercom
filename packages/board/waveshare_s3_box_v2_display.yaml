light:
- platform: monochromatic
  id: backlight
  name: Display Backlight
  icon: mdi:brightness-6
  output: backlight_output
  restore_mode: ALWAYS_ON
  default_transition_length: 250ms
spi:
- id: display_qspi
  type: quad
  clk_pin: GPIO40
  data_pins:
  - GPIO46
  - GPIO45
  - GPIO42
  - GPIO41
output:
- platform: ledc
  id: backlight_output
  pin: ${display_backlight_pin}
  inverted: false
touchscreen:
- platform: cst816
  id: touch
  display: s3_box_lcd
  i2c_id: i2c_bus
  interrupt_pin: ${touch_interrupt_pin}
  reset_pin:
    pca9554: io_expander
    number: 0
