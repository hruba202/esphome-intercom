# Standalone telephone hardware; OTA is composed with the selected consumers.
substitutions:
  hosted_reset_pin: GPIO54
  hosted_cmd_pin: GPIO19
  hosted_clk_pin: GPIO18
  hosted_d0_pin: GPIO14
  hosted_d1_pin: GPIO15
  hosted_d2_pin: GPIO16
  hosted_d3_pin: GPIO17
  codec_i2c_sda_pin: GPIO7
  codec_i2c_scl_pin: GPIO8
  i2s_mclk_pin: GPIO13
  i2s_bclk_pin: GPIO12
  i2s_lrclk_pin: GPIO10
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9
  display_reset_pin: '27'
  display_backlight_pin: GPIO26
  speaker_enable_pin: GPIO53
packages:
  p4_base: !include '../platform/esp32p4_base.yaml'
  p4_c6_sdio: !include 'esp32p4_c6_sdio.yaml'
psram:
  mode: hex
  speed: 200MHz
esp_ldo:
- channel: 3
  voltage: 2.5V
network:
  enable_high_performance: false
esp32_hosted:
  variant: ESP32C6
  use_psram: true
  reset_pin: ${hosted_reset_pin}
  cmd_pin: ${hosted_cmd_pin}
  clk_pin: ${hosted_clk_pin}
  d0_pin: ${hosted_d0_pin}
  d1_pin: ${hosted_d1_pin}
  d2_pin: ${hosted_d2_pin}
  d3_pin: ${hosted_d3_pin}
  active_high: true
esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: '16'
      CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: '64'
      CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: '64'
      CONFIG_WIFI_RMT_TX_BA_WIN: '32'
      CONFIG_WIFI_RMT_RX_BA_WIN: '32'
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: '64'
i2c:
- id: internal_i2c
  sda: ${codec_i2c_sda_pin}
  scl: ${codec_i2c_scl_pin}
  frequency: 400kHz
  scan: false
output:
- platform: gpio
  id: speaker_enable
  pin: ${speaker_enable_pin}
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
  - priority: -100
    then:
    - output.turn_off: speaker_enable
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: none
  reboot_timeout: 10min
  fast_connect: false
api:
  reboot_timeout: 15min
logger:
  hardware_uart: UART0
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
preferences:
  flash_write_interval: 5min
