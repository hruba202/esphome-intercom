# Standalone telephone hardware; OTA is composed with the selected consumers.
esphome:
  min_version: 2026.9.0
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: 600
    then:
    - output.turn_on: speaker_enable
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_AND_LWIP_STACKS_IN_EXTERNAL_RAM: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: '4096'
psram:
  mode: octal
  speed: 80MHz
logger:
  level: DEBUG
api:
  custom_services: true
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: NONE
i2c:
  id: i2c_bus
  sda: GPIO11
  scl: GPIO10
  scan: true
pca9554:
- id: pca9554_device
  address: 32
output:
- platform: gpio
  id: speaker_enable
  pin: ${speaker_enable_pin}
packages: {}
