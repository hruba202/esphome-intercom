# Generic reference hardware and connectivity; application gestures are composed separately.
esphome:
  min_version: 2026.9.0
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  variant: esp32s3
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
psram:
  mode: quad
  speed: 80MHz
preferences:
  flash_write_interval: 5min
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: NONE
api:
  custom_services: true
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
    api.service: INFO
    light: INFO
    select: INFO
    speaker: INFO
    audio: INFO
    micro_wake_word: INFO
    voice_assistant: INFO
    media_player: INFO
    resampler: INFO
    mixer_speaker: INFO
    wifi: INFO
    json: INFO
    voip_stack: INFO
packages:
  platform: !include '../platform/esp32s3_base.yaml'
binary_sensor:
- platform: gpio
  name: Boot Button
  id: boot_button
  pin:
    number: GPIO0
    inverted: true
    mode:
      input: true
      pullup: true
