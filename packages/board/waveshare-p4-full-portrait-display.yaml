# Native P4 panel, touch and backlight, without application handlers.
display:
- platform: mipi_dsi
  id: main_display
  model: WAVESHARE-P4-NANO-10.1
  reset_pin: ${display_reset_pin}
  lane_bit_rate: 1500Mbps
  vsync_back_porch: 10
  dimensions:
    width: 800
    height: 1280
  update_interval: never
  auto_clear_enabled: false
touchscreen:
- platform: gt911
  id: main_touch
  i2c_id: internal_i2c
  address: 93
  display: main_display
light:
- platform: monochromatic
  id: display_backlight
  name: Display Backlight
  output: backlight_pwm
  restore_mode: ALWAYS_ON
  default_transition_length: 250ms
output:
- platform: ledc
  id: backlight_pwm
  pin: ${display_backlight_pin}
  inverted: false
  frequency: 1000Hz
