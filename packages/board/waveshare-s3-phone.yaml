# Standalone telephone hardware; OTA is composed with the selected consumers.
esphome:
  min_version: 2026.9.0
  name: ${name}
  friendly_name: ${friendly_name}
esp32:
  flash_mode: dio
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
psram:
  mode: octal
  speed: 80MHz
preferences:
  flash_write_interval: 5min
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: NONE
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
i2c:
- id: internal_i2c
  sda: ${codec_i2c_sda_pin}
  scl: ${codec_i2c_scl_pin}
  scan: false
tca9555:
- id: io_expander
  address: 32
  i2c_id: internal_i2c
api:
  custom_services: true
packages:
  s3_base: !include '../platform/esp32s3_base.yaml'
