# BOX-3 base board and codec I2C bus; display and sensor dock are separate.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  platformio_options:
    board_build.flash_mode: dio
esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: '10'
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: '32'
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: '32'
      CONFIG_ESP_WIFI_TX_BA_WIN: '16'
      CONFIG_ESP_WIFI_RX_BA_WIN: '16'
psram:
  mode: octal
  speed: 80MHz
preferences:
  flash_write_interval: 5min
network:
  enable_high_performance: false
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: NONE
api:
  custom_services: true
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
    api.service: INFO
    light: INFO
    select: INFO
    speaker: INFO
    audio: INFO
    micro_wake_word: INFO
    voice_assistant: INFO
    media_player: INFO
    resampler: INFO
    mixer_speaker: INFO
    wifi: INFO
    json: INFO
i2c:
- id: internal_i2c
  sda: ${codec_i2c_sda_pin}
  scl: ${codec_i2c_scl_pin}
  scan: false
binary_sensor:
- platform: gpio
  name: Boot Button
  id: boot_button
  pin:
    number: GPIO0
    inverted: true
    mode:
      input: true
      pullup: true
packages:
  platform: !include '../platform/esp32s3_base.yaml'
