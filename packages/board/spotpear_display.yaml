# Spotpear LCD, touch bus and backlight wiring, without application behavior.
display:
- platform: mipi_spi
  id: s3_box_lcd
  model: GC9A01A
  psram_dma: true
  invert_colors: true
  data_rate: 40MHz
  cs_pin: 5
  dc_pin: 47
  reset_pin:
    number: 38
  auto_clear_enabled: false
  dimensions:
    height: 240
    width: 240
light:
- platform: monochromatic
  id: backlight
  name: Display Backlight
  icon: mdi:brightness-6
  output: backlight_output
  restore_mode: ALWAYS_ON
  default_transition_length: 250ms
spi:
- id: spi_bus
  clk_pin: 4
  mosi_pin: 2
i2c:
- id: touchscreen_i2c_bus
  sda: ${touch_i2c_sda_pin}
  scl: ${touch_i2c_scl_pin}
  scan: false
output:
- platform: ledc
  id: backlight_output
  pin: ${display_backlight_pin}
  inverted: true
touchscreen:
- platform: cst816
  id: touch
  display: s3_box_lcd
  i2c_id: touchscreen_i2c_bus
  interrupt_pin: ${touch_interrupt_pin}
  reset_pin: ${touch_reset_pin}
