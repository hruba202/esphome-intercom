# Waveshare S3 Audio hardware and connectivity. Application gestures are separate.
network:
  enable_high_performance: false
tca9555:
  - id: io_expander
    address: 0x20
    i2c_id: internal_i2c
esphome:
  min_version: 2026.9.0
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN: '16384'
      CONFIG_MBEDTLS_HARDWARE_AES: y
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: '10'
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: '32'
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: '32'
      CONFIG_ESP_WIFI_TX_BA_WIN: '16'
      CONFIG_ESP_WIFI_RX_BA_WIN: '16'
psram:
  mode: octal
  speed: 80MHz
i2c:
  - id: internal_i2c
    sda: ${codec_i2c_sda_pin}
    scl: ${codec_i2c_scl_pin}
    scan: false
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  power_save_mode: NONE
api:
  custom_services: true
logger:
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
packages:
  platform: !include ../platform/esp32s3_base.yaml
binary_sensor:
  - platform: gpio
    name: Boot Button
    id: boot_button
    pin:
      number: ${boot_button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
  - platform: gpio
    name: Key 1
    id: key1
    internal: true
    pin:
      tca9555: io_expander
      number: 9
      inverted: true
      mode:
        input: true
  - platform: gpio
    name: Key 2
    id: key2
    internal: true
    pin:
      tca9555: io_expander
      number: 10
      inverted: true
      mode:
        input: true
  - platform: gpio
    name: Key 3
    id: key3
    internal: true
    pin:
      tca9555: io_expander
      number: 11
      inverted: true
      mode:
        input: true
