# Reducer only. Consumer modules supply their policies and hardware bindings.
esphome:
  min_version: 2026.10.0
defaults:
  runtime_controller_debug: ${ runtime_controller_debug | default("false") }
substitutions:
  runtime_controller_debug: ${runtime_controller_debug}
runtime_controller:
  id: runtime
  debug: ${runtime_controller_debug}
  profile: full_voice_voip
  features: []
