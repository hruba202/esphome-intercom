# Physical audio for the standalone phone. Playback adapters are selected as a compatible set.
esp_audio_stack:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  correct_dc_offset: true
  processor_id: aec_processor
  master_volume_min_db: -30.0
  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 64
      mic_selected: 15
      gain_db: 24.0
    output:
      type: es8311
      address: 24
      use_mclk: true
      no_dac_ref: true
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slot: 0
  tdm_ref_slot: 1
  buffers_in_psram: true
esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: voip_high_perf
microphone:
- platform: esp_audio_stack
  id: mic_main
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
- platform: mixer
  id: audio_mixer
  output_speaker: hw_speaker
  num_channels: 1
  source_speakers:
  - id: voip_mixer_input
    timeout: 10s
    buffer_duration: 128ms
  - id: ringtone_speaker_mix
    timeout: 10s
    buffer_duration: 100ms
- platform: resampler
  id: voip_speaker_input
  output_speaker: voip_mixer_input
  bits_per_sample: 16
  buffer_duration: 128ms
- platform: resampler
  id: ringtone_speaker
  output_speaker: ringtone_speaker_mix
switch:
- platform: gpio
  id: speaker_enable
  internal: true
  restore_mode: ALWAYS_OFF
  pin:
    tca9555: io_expander
    number: 8
    mode:
      output: true
external_components:
- source: ${audio_stack_components_source}
  components:
  - esp_audio_stack
  - resampler
  - esp_aec
packages:
  speaker_mute: !include '../../voip/speaker_mute.yaml'
  audio_stack_controls: !include '../../esp_audio_stack/controls.yaml'
  audio_stack_aec_controls: !include '../../esp_audio_stack/aec_controls.yaml'
  speaker_power: !include '../../esp_audio_stack/speaker_power_switch.yaml'
  playback_compatibility: !include '../../media_player/playback_compat.yaml'
