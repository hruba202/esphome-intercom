# Physical audio for the standalone phone. Playback adapters are selected as a compatible set.
esp_audio_stack:
  task_core: 1
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 32
  correct_dc_offset: true
  processor_id: aec_processor
  aec_reference: previous_frame
  buffers_in_psram: true
esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: fd_high_perf
microphone:
- platform: esp_audio_stack
  id: mic_main
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
- platform: resampler
  id: voip_speaker_input
  output_speaker: hw_speaker
  bits_per_sample: 16
switch: null
external_components:
- source: ${audio_stack_components_source}
  components:
  - esp_audio_stack
  - esp_aec
packages:
  speaker_mute: !include '../../voip/speaker_mute.yaml'
  audio_stack_controls: !include '../../esp_audio_stack/controls.yaml'
  audio_stack_aec_controls: !include '../../esp_audio_stack/aec_controls.yaml'
  playback_compatibility: !include '../../media_player/playback_compat.yaml'
