# Compatibility adapter with the original full-profile prerequisites and restore alias.
# Lifecycle globals still belong to the caller; the shared script owns transitions.
defaults:
  _fw_voice: true
  _fw_wake_word: true
  _fw_voip: true
  _fw_music: true
  _fw_announcements: true
  _fw_timers: false
  _fw_lvgl: false
  firmware_audio_backend: native
packages:
  ota_backend: !include 'idf_backend.yaml'
  maintenance: !include '../features/shared/maintenance.yaml'
script:
- id: ota_full_native_audio_restore
  mode: restart
  then:
  - script.execute:
      id: firmware_maintenance
      resume: true
