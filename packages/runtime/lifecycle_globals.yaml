# Runtime lifecycle state; maintenance state has one shared declaration.
globals:
- id: init_in_progress
  type: bool
  restore_value: false
  initial_value: 'true'
- id: runtime_activity_mask
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: runtime_sequence
  type: uint32_t
  restore_value: false
  initial_value: '0'
packages:
  ota_state: !include '../features/shared/ota_state.yaml'
